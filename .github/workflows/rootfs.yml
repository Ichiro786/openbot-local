name: Engine rootfs

# Builds a checked engine artifact for the test APK. No release or pointer is changed.

on:
  workflow_dispatch:
    inputs:
      openbot_version:
        description: "OpenBot version to package, e.g. 0.57.0 (blank = latest release)"
        required: false
        default: ""
      revision:
        description: "Payload revision for the same OpenBot version: 1 -> engine-<version>-1 (blank = none)"
        required: false
        default: ""
      smoke_test:
        description: "Start the engine once in a chroot and in proot before artifact upload"
        type: boolean
        default: true
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

permissions:
  contents: read

concurrency:
  group: engine-rootfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OUT_DIR: ${{ github.workspace }}/out
      WORK_DIR: ${{ github.workspace }}/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenBot version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.openbot_version }}
          SMOKE_TEST: ${{ inputs.smoke_test }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            version=$(curl -fsSL --retry 3 https://github.com/nightly-labs/openbot/releases/latest/download/latest-linux-arm64.yml \
              | sed -n 's/^version: *//p' | head -n 1)
          fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid OpenBot version '$version'"; exit 1; }
          revision="${INPUT_REVISION:-}"
          [[ -z $revision || $revision =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid revision '$revision'"; exit 1; }
          tag="engine-$version${revision:+-$revision}"
          [ "${SMOKE_TEST:-true}" = true ] || { echo "::error::Smoke tests are required"; exit 1; }
          pin="engine/patches/$version/UPSTREAM_REF"
          [ -f "$pin" ] || { echo "::error::No reviewed patch set for $version"; exit 1; }
          source_sha=$(tr -d '[:space:]' < "$pin")
          [[ $source_sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid source pin"; exit 1; }
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "tag=$tag"
            echo "build=true"
          } >>"$GITHUB_OUTPUT"
          echo "OpenBot $version, artifact $tag, source $source_sha"

      - name: Install host tools
        if: steps.ver.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates xz-utils openssl proot shellcheck jq gcc libc6-dev

      # engine/patch-engine-main.sh rebuilds the main bundle from source when engine/patches/<version> exists.
      - name: Set up Bun (engine patches)
        if: steps.ver.outputs.build == 'true' && hashFiles('engine/patches/**/*.patch') != ''
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Lint engine scripts
        if: steps.ver.outputs.build == 'true'
        run: |
          for f in engine/*.sh; do bash -n "$f"; done
          shellcheck -S warning engine/*.sh || echo "::warning::shellcheck reported warnings"

      - name: Build rootfs
        if: steps.ver.outputs.build == 'true'
        env:
          OPENBOT_VERSION: ${{ steps.ver.outputs.version }}
          ENGINE_REVISION: ${{ steps.ver.outputs.revision }}
          GIT_SHA: ${{ github.sha }}
        run: |
          export BUN_BIN=$(command -v bun)
          export NODE_BIN=$(command -v node)
          sudo --preserve-env=OUT_DIR,WORK_DIR,OPENBOT_VERSION,ENGINE_REVISION,GIT_SHA,GH_TOKEN,BUN_BIN,NODE_BIN bash engine/build-rootfs.sh
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          ls -l "$OUT_DIR"

      - name: Smoke test (chroot)
        id: smoke_chroot
        if: steps.ver.outputs.build == 'true'
        run: |
          set -o pipefail
          sudo SMOKE_TIMEOUT=300 bash engine/smoke-test.sh "$WORK_DIR/rootfs" chroot | tee "$OUT_DIR/smoke-chroot.log"

      - name: Smoke test (proot)
        id: smoke_proot
        if: steps.ver.outputs.build == 'true'
        run: |
          set -o pipefail
          sudo SMOKE_TIMEOUT=420 bash engine/smoke-test.sh "$WORK_DIR/rootfs" proot | tee "$OUT_DIR/smoke-proot.log"

      - name: Upload workflow artifact
        if: steps.ver.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.tag }}-rootfs-arm64
          path: |
            out/rootfs-arm64.tar.xz
            out/rootfs-arm64.tar.xz.sha256
            out/engine.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-checks-${{ github.run_id }}
          path: |
            out/upgrade-checks/
            out/smoke-*.log
          if-no-files-found: warn
          retention-days: 14

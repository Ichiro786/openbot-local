name: Build OpenBot Local (Android APK)

# Personal side-by-side build of the OpenBot mobile app:
#   applicationId run.openbot.local, name "OpenBot Local", scheme openbotlocal://
# Produces an arm64-v8a release APK signed with the Expo template's debug keystore
# (installable via adb / file manager; NOT suitable for Play Store).

# The APK bundles the newest `engine-<version>` release (rootfs payload) of this repository; build
# that first with the "Engine rootfs" workflow (rootfs.yml). A finished rootfs run triggers this one.
on:
  push:
    branches: [main]
    # Engine changes reach the APK through rootfs.yml -> workflow_run.
    paths-ignore:
      - "engine/**"
      - ".github/workflows/rootfs.yml"
      - ".github/workflows/apk-release.yml"
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "Engine release to bundle, e.g. engine-0.57.0 (blank = newest)"
        required: false
        default: ""
      skip_payload:
        description: "Compile-check only: build without the engine payload (APK cannot install the engine)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Engine rootfs"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-local-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Prebuild + assembleRelease (arm64-v8a)
    # workflow_run fires for failed rootfs runs too; only a successful one has a new payload.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_APP_ENV: production
      NODE_ENV: production
      # Root postinstall installs Electron for the desktop app; the phone build does not need it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A React Native release build needs more disk than the runner leaves free.
      - name: Free runner disk
        run: |
          # The engine payload is copied several times through Gradle's asset merge/package steps.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/local/share/powershell /usr/share/swift /opt/az /opt/microsoft /opt/google /usr/local/julia* \
            /usr/local/share/chromium /usr/lib/jvm/*-11-* /usr/local/aws-cli /usr/local/aws-sam-cli || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h / /mnt "$GITHUB_WORKSPACE"

      # Same toolchain the upstream release-android workflow uses: pinned Bun + Node from .nvmrc.
      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Upstream note: Skia + Reanimated + Worklets + R8 can exhaust the 16 GB runner.
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
          # Swap on the separate /mnt disk so it does not eat the root disk the build needs.
          sudo fallocate -l 8G /mnt/swapfile-build
          sudo chmod 600 /mnt/swapfile-build
          sudo mkswap /mnt/swapfile-build
          sudo swapon /mnt/swapfile-build
          free -h

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.json', 'apps/mobile/package.json', 'apps/mobile/modules/*/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # proot + libtalloc + libandroid-shmem from Termux, renamed lib*.so into the module's jniLibs.
      - name: Fetch proot (Termux arm64)
        working-directory: apps/mobile/modules/openbot-engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf >/dev/null
          bash scripts/fetch-proot.sh
          cat scripts/proot.lock

      # The rootfs payload goes into the APK assets (stored uncompressed). Fails when no release exists.
      - name: Stage engine payload
        id: payload
        if: ${{ !inputs.skip_payload }}
        working-directory: apps/mobile/modules/openbot-engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENGINE_REPO: ${{ github.repository }}
          ENGINE_TAG: ${{ inputs.engine_tag }}
        run: |
          set +e
          bash scripts/stage-engine-payload.sh
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "::error title=No engine release::No engine-<version> release in ${ENGINE_REPO}. Run the 'Engine rootfs' workflow first; this build starts again when it succeeds."
          fi
          exit "$rc"

      # Safety net: generate the adaptive / monochrome (Material You themed) icon layers if they
      # are missing from the commit. Normally they are committed; see apps/mobile/scripts-local/.
      - name: Ensure adaptive icon layers
        working-directory: apps/mobile
        run: |
          if [ ! -f assets/icons/adaptive-monochrome.png ] || [ ! -f assets/icons/adaptive-foreground.png ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
            bash scripts-local/make-adaptive-icons.sh
          fi
          ls -la assets/icons/

      - name: Expo config sanity check
        working-directory: apps/mobile
        run: |
          bunx expo config --type public --json > /tmp/expo-config.json
          node -e '
            const c = require("/tmp/expo-config.json");
            console.log("name:", c.name, "| package:", c.android.package, "| scheme:", c.scheme);
            console.log("adaptiveIcon:", JSON.stringify(c.android.adaptiveIcon));
            if (c.android.package !== "run.openbot.local") process.exit(1);
            if (!c.android.adaptiveIcon || !c.android.adaptiveIcon.monochromeImage) process.exit(1);
            if (c.android.googleServicesFile) { console.error("google-services must stay off"); process.exit(1); }
            const plugins = (c.plugins || []).map((p) => (Array.isArray(p) ? p[0] : p));
            if (!plugins.some((p) => String(p).includes("openbot-engine"))) console.warn("::warning::openbot-engine plugin not listed in the public config");
          '

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK (arm64-v8a, debug keystore)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # The Expo template signs `release` with signingConfigs.debug (android/app/debug.keystore).
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --stacktrace
          df -h /

      - name: Collect APK
        id: apk
        env:
          ENGINE_TAG: ${{ steps.payload.outputs.tag }}
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          OUT="openbot-local-arm64-v8a-${GITHUB_SHA::7}-${ENGINE_TAG:-nopayload}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # The engine needs: the proot binaries as lib*.so (extracted at install: legacy packaging, so
      # the libs are deflated rather than stored page-aligned), the payload stored uncompressed, and
      # android:extractNativeLibs="true" in the merged manifest.
      - name: Verify APK contents
        env:
          APK: ${{ steps.apk.outputs.path }}
          SKIP_PAYLOAD: ${{ inputs.skip_payload }}
        run: |
          set -euo pipefail
          unzip -v "$APK" | grep -E 'lib/arm64-v8a/lib(proot|proot-loader|talloc|android-shmem)\.so|assets/engine/' | tee /tmp/apk-list.txt
          for f in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            grep -q "lib/arm64-v8a/$f" /tmp/apk-list.txt || { echo "::error::$f missing from the APK"; exit 1; }
          done
          if [ "$SKIP_PAYLOAD" = true ]; then
            echo "::warning::built without the engine payload (compile check only)"
          else
            grep -E 'assets/engine/rootfs-arm64\.tar\.xz$' /tmp/apk-list.txt | grep -q ' Stored ' ||
              { echo "::error::assets/engine/rootfs-arm64.tar.xz missing or compressed"; exit 1; }
            grep -q 'assets/engine/rootfs-arm64.tar.xz.sha256' /tmp/apk-list.txt || { echo "::error::payload sha256 missing"; exit 1; }
          fi
          MANIFEST=$(find apps/mobile/android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -path '*merged_manifest*' | head -n1)
          echo "merged manifest: $MANIFEST"
          if [ -n "$MANIFEST" ]; then
            grep -o 'android:extractNativeLibs="[a-z]*"' "$MANIFEST" || echo "::warning::extractNativeLibs not in $MANIFEST"
            grep -q 'run.openbot.engine.EngineService' "$MANIFEST" || { echo "::error::EngineService not in the merged manifest"; exit 1; }
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openbot-local-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Approved repository branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/repository-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run user-approved branch archival and cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive unique history before deleting approved branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          def run(*args): return subprocess.check_output(args,text=True).strip()
          records=json.loads("[{\"name\":\"build7-coloros\",\"sha\":\"406fcb7fe2dc5100ce3a9b751f369f5a70dd7e3b\"},{\"name\":\"build7-fix\",\"sha\":\"f6ffa47fda25db36de3f50ea96cb677168cc48c8\"},{\"name\":\"build8-prep\",\"sha\":\"df7528322419c0827c50505fec0d1762cfced396\"},{\"name\":\"build9-coloros\",\"sha\":\"7f1fcef729dcfe499f88dadfc43e5d67128e464d\"},{\"name\":\"build9-review-ci\",\"sha\":\"988dd666e5f50c22790b093b9053cb7a56ca3e1e\"},{\"name\":\"build10-review-ci\",\"sha\":\"590e2b1e8bf5cdb754901b046edc622e06d44607\"},{\"name\":\"build10\",\"sha\":\"ad34cebbcc48f40ba78134eb46f1328eeae6ebd0\"},{\"name\":\"build11-2-ci\",\"sha\":\"14f89611bd9a1eaec1a6c651480ac9ad49615f17\"},{\"name\":\"build11-2\",\"sha\":\"fcaf12c64a6adc47918c16a175cd8e9906392462\"},{\"name\":\"build11-3-batch1\",\"sha\":\"c389744e9b1239e0e61f4a8e2843bdb8fbceee57\"},{\"name\":\"build11-3-batch2\",\"sha\":\"258c6db045d56f7ee1a5acc5799690e87e5fd26d\"},{\"name\":\"build11-3-diag\",\"sha\":\"4696013ed6001fcef849f3b2f6717f800d33f5d5\"},{\"name\":\"build11-3-menufix\",\"sha\":\"012c70f5fd2848c3b05771acb4a7b01c0b6af49b\"},{\"name\":\"build11-3-motion\",\"sha\":\"5824211d08153b5bc99291409f509f3c72507a7f\"},{\"name\":\"build11-3-pop\",\"sha\":\"d01c33b521fbeac3de1f504a6d62e944a28a3e70\"},{\"name\":\"build11-3-zoomfix\",\"sha\":\"ecbee25306fa9d6cd338abaafd72e5deef780fcf\"},{\"name\":\"build11-3\",\"sha\":\"960cd6199c1a3bfdf8c3aa6fdad49be28f5030d1\"},{\"name\":\"build11-4\",\"sha\":\"b6575424bb317bc1f8d6ebddd4350b3649d7d7c4\"},{\"name\":\"build11-5\",\"sha\":\"7ae73a17b700de10d45e738adb6ced91928819d0\"},{\"name\":\"build11-review-ci\",\"sha\":\"ed3de711e234c42da7666d1bfc017fd05ef85ef3\"},{\"name\":\"build11\",\"sha\":\"852b18e762fdd38eab2bcbbb19b9b773eff22648\"},{\"name\":\"build12-ci\",\"sha\":\"c92db329ab45297e802a5be9c1acffccef9de743\"},{\"name\":\"build12\",\"sha\":\"d296186b16508642fb751b00492a1aa9b0ecafa0\"},{\"name\":\"build13-ci\",\"sha\":\"76ea0eca351d41b396e12fe37b7ff3d4030d7fe2\"},{\"name\":\"build13\",\"sha\":\"62e3b39aa5700b5c9780efc1f30364e5e047ec6f\"},{\"name\":\"build14-ci\",\"sha\":\"24fb80e1e196854c26eb2269516b1a90145552af\"},{\"name\":\"build14\",\"sha\":\"0a961f54503bab008bd5f41cfca7282e814f4980\"},{\"name\":\"build15-ci\",\"sha\":\"8a40dd30489535df82c2445e4b9b6f6068db24c9\"},{\"name\":\"build15\",\"sha\":\"4b326320043add71723b28a48815ba897563a5c6\"},{\"name\":\"build15.1\",\"sha\":\"5b601af6b809d42c8cd1454f74f7c2fbb038a0cc\"},{\"name\":\"build15.2\",\"sha\":\"437afe7bb7fa1c5292c418f3f61a9cfb773259f7\"},{\"name\":\"build15.3\",\"sha\":\"3131a963fc95559638413972d3a6f7a28e7520eb\"},{\"name\":\"build16-ci\",\"sha\":\"380e0a8c9ba608ef41ba87ab86b461d1a31820f5\"},{\"name\":\"build16\",\"sha\":\"2387ffb290eb6c31889d82bfaefd6b4338d11efe\"},{\"name\":\"build16.1\",\"sha\":\"731a6866d6702e1f6df5ce213031a726aaac76b3\"},{\"name\":\"build17\",\"sha\":\"0a0cd5f5747734ed50767fcd397ca85413499e6b\"},{\"name\":\"build151-ci\",\"sha\":\"28e5432b9097f1ef7ca5ee1e67d6600600370c04\"},{\"name\":\"build153-ci\",\"sha\":\"200cd87f633692a1cbd5a3ce1c1d0f6bcf02723b\"},{\"name\":\"build161-ci\",\"sha\":\"4e0fd807347dff321ef732dfc0781a7c23f7ca93\"},{\"name\":\"codex/build17-continuation\",\"sha\":\"bf5d64a92df6fc1243e55a935acb7f9a0a2602fb\"},{\"name\":\"council-frames\",\"sha\":\"06e34fa2395b6adb2bf79cef95de97d94f42ccff\"},{\"name\":\"council-latency\",\"sha\":\"90d2583b78859a7b94cc204a52dd0fdabd865cd0\"},{\"name\":\"council-motion\",\"sha\":\"0d2e945d65ab0a0e288867f7f79a6436a87001df\"},{\"name\":\"dependabot/bun/compatible-updates-8e56e30b6b\",\"sha\":\"dd40da0883b066841968322fa1e1dc6758ad3641\"},{\"name\":\"dependabot/bun/compatible-updates-58641d0907\",\"sha\":\"212705e2e46ca01b8ef9de518278f648c4b5146a\"},{\"name\":\"dependabot/bun/compatible-updates-ea20923e58\",\"sha\":\"c1e551b5756ec168c5420d5d00df38fe4224a651\"},{\"name\":\"dependabot/bun/kobalte/core-2.0.0-alpha.4\",\"sha\":\"9dd533efa43c088121228abccfa409ea28e47fd9\"},{\"name\":\"dependabot/bun/solid-js-2.0.0-rc.19\",\"sha\":\"b8015e621563a744c8221a696c4f58552b8d87a0\"},{\"name\":\"dependabot/bun/solidjs/signals-2.0.0-rc.19\",\"sha\":\"1b1a433e4b6680eb3d555ad09d257505eac732df\"},{\"name\":\"dependabot/bun/solidjs/vite-plugin-3.0.0-next.52\",\"sha\":\"ff80b7759e7f1b01b3821ce7fdd4fffdb49d4b28\"},{\"name\":\"dependabot/github_actions/actions/cache-6\",\"sha\":\"c3465d7b1082e0c0d29c0fca97f9b15cb6ca4d02\"},{\"name\":\"dependabot/github_actions/actions/checkout-7\",\"sha\":\"31c62f5c558977b57a917362c22719a27b5bfb57\"},{\"name\":\"dependabot/github_actions/actions/upload-artifact-7\",\"sha\":\"5cbbf6a068524c1bb67cdd6ca18b49b877de8afe\"},{\"name\":\"engine-0.60\",\"sha\":\"953d4d0c74daa4441b24e477e5f7b2224dd0da8f\"},{\"name\":\"engine-0.61\",\"sha\":\"a70dc201a51aefbddadf9cbaabd38fc6d2ef6e18\"},{\"name\":\"engine-0.69\",\"sha\":\"a1cbf4e353a4d69eb1e8f4eb4a9a8822f661fdd8\"},{\"name\":\"engine-0.70\",\"sha\":\"14a4d30207c824f407fddf72505cadc583eef202\"},{\"name\":\"engine-0.71\",\"sha\":\"6c99c2bfe60ad65e64b72042b3025af41ecd5df9\"},{\"name\":\"engine-0.72\",\"sha\":\"66f8f91877381b5060218607cbaf7573001ba168\"},{\"name\":\"engine-patches-0.60\",\"sha\":\"4990d5876172a03848929021e3925ef405a4fc79\"},{\"name\":\"fix/mobile-ui-audit-apk\",\"sha\":\"9279514958bd8545c95a0a2475b6c6798c7817ed\"},{\"name\":\"hotfix-11-1\",\"sha\":\"1352751e193ec350326bf8471a6eed1c45bb17ec\"},{\"name\":\"research/engine-optimize\",\"sha\":\"12496876ab9efd0df7867c440a6ec9e58c037a67\"}]")
          repo=os.environ["GITHUB_REPOSITORY"]
          # Fail before mutation if any branch has changed.
          for b in records:
              actual=json.loads(run("gh","api",f"repos/{repo}/git/ref/heads/{b['name']}"))["object"]["sha"]
              assert actual==b["sha"], "Branch changed: "+b["name"]
          for b in records:
              merged=subprocess.run(["git","merge-base","--is-ancestor",b["sha"],"HEAD"]).returncode==0
              b["included_in_main"]=merged
              b["archive_tag"]=None if merged else "archive/2026-11-18/"+b["name"]
              if b["archive_tag"]:
                  tag=b["archive_tag"]
                  subprocess.run(["git","tag",tag,b["sha"]],check=True)
                  subprocess.run(["git","push","origin","refs/tags/"+tag],check=True)
                  remote=run("git","ls-remote","origin","refs/tags/"+tag).split()[0]
                  assert remote==b["sha"], "Archive verification failed: "+tag
          # All divergent tips now have verified remote archive tags.
          for b in records:
              ref="heads/"+b["name"]
              actual=json.loads(run("gh","api",f"repos/{repo}/git/ref/{ref}"))["object"]["sha"]
              assert actual==b["sha"], "Branch changed: "+b["name"]
              subprocess.run(["gh","api","--method","DELETE",f"repos/{repo}/git/refs/{ref}"],check=True)
          remaining=json.loads(run("gh","api",f"repos/{repo}/branches?per_page=100"))
          assert [b["name"] for b in remaining]==["main"],remaining
          path=pathlib.Path("docs/branch-cleanup-2026-11-18.json")
          path.write_text(json.dumps(records,indent=2)+"\n")
          path=pathlib.Path("docs/branch-cleanup-2026-11-18.md")
          path.write_text("# Repository cleanup — 2026-11-18\n\nCompleted with explicit user approval. Main is the sole active branch. The tested Build 17 application and engine 0.72 source are on main. Removed 63 branch refs. Divergent history is retained under archive/2026-11-18/ tags; the JSON inventory records every original tip and its preservation route. Existing releases and release tags were retained. Scheduled Dependabot version updates are disabled. Historical experiments and untested dependency upgrades were archived, not merged into the working application.\n")
          subprocess.run(["git","add","docs/branch-cleanup-2026-11-18.json","docs/branch-cleanup-2026-11-18.md"],check=True)
          subprocess.run(["git","rm",".github/workflows/repository-cleanup.yml"],check=True)
          subprocess.run(["git","commit","-m","Record completed branch cleanup and remove one-time workflow"],check=True)
          subprocess.run(["git","push","origin","HEAD:main"],check=True)
          print(f"Cleanup complete: removed {len(records)} branches; main only.")
          PY

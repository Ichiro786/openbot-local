name: Engine optimize probe (research)

# Research only: measures the OpenBot Local engine payload's size, unpack speed, boot time and idle cost on a
# native arm64 runner, the app's way (engine/optim/probe.sh). Runs on pushes to research/engine-optimize only.
# Publishes nothing: no release, no tag. One step and one artifact per phase.
# Run 4 (Build 17 fix check): builds the 0.72.0 payload from branch engine-0.72 (as rootfs.yml, without publishing),
# then checks the idle fix (patch 0005 loop rest): idle with and without it, chroot strace, CDP smoke.
# Run 3's engine-0.71.0-1 numbers are the baseline. probe.sh's t() never prints VAR=value words.

on:
  push:
    branches: [research/engine-optimize]
    paths: [engine/optim/**, .github/workflows/engine-optimize-probe.yml]

permissions:
  contents: read

concurrency:
  group: engine-optimize-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /var/ob
      ENG_REF: engine-0.72
    steps:
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google || true
          df -h /
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine/optim
      - name: Check out the engine branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENG_REF }}
          path: eng
      - name: Set up Bun (engine patches)
        uses: ./eng/.github/actions/setup-bun
        with:
          install: none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Host tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends curl ca-certificates xz-utils zstd jq bc libtalloc-dev strace openssl gcc libc6-dev python3-websocket
          echo "ENG_SHA=$(git -C eng rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build proot (termux/proot, the phone's proot)
        run: |
          git clone -q --depth 1 https://github.com/termux/proot "$RUNNER_TEMP/proot-src"
          make -s -C "$RUNNER_TEMP/proot-src/src" -j"$(nproc)" HAS_LOADER_32BIT= proot
          echo "PROOT=$RUNNER_TEMP/proot-src/src/proot" >> "$GITHUB_ENV"
      - name: Phase build17
        timeout-minutes: 60
        run: |
          mkdir -p out
          sudo -E env "PATH=$PATH" OUT_ROOT="$PWD/out" WORK="$WORK" ENG="$PWD/eng" ENG_SHA="$ENG_SHA" BUN_BIN="$(command -v bun)" \
            GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash engine/optim/probe.sh build17 2>&1 | tee out/log-build17.txt
          sudo chown -R "$(id -u)" out
          test -s "$WORK/out17/rootfs-arm64.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: probe-build17, path: out/build17/ }
      - name: Phase fix17
        if: always()
        continue-on-error: true
        timeout-minutes: 75
        run: |
          mkdir -p out
          sudo -E env "PATH=$PATH" OUT_ROOT="$PWD/out" PROOT="$PROOT" WORK="$WORK" \
            bash engine/optim/probe.sh fix17 2>&1 | tee out/log-fix17.txt
          sudo chown -R "$(id -u)" out
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: probe-fix17, path: out/fix17/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-logs, path: out/log-*.txt }
